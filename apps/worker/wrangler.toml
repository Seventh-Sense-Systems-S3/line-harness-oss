name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# ═══════════════════════════════════════════════════════════════
# デフォルト = テスト環境 (noda@)
# 使い方: npx wrangler deploy
# ═══════════════════════════════════════════════════════════════
account_id = "c4d92c479a309c53bf05082a7e938bd1"

[assets]
directory = "dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "line-harness"
database_id = "YOUR_DEV_D1_DATABASE_ID"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

# ═══════════════════════════════════════════════════════════════
# 本番環境 (aiagent.mini@)
# 使い方: npx wrangler deploy --env production --name your-worker-name
# D1:     npx wrangler d1 execute line-crm --env production --remote --file ...
# ═══════════════════════════════════════════════════════════════
[env.production]
name = "line-crm-worker"
account_id = "c4d92c479a309c53bf05082a7e938bd1"

[env.production.assets]
directory = "dist/client"
binding = "ASSETS"

[[env.production.d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "f6958f40-8b53-4ec3-ba1b-08fc00fcb669"
migrations_dir = "../../packages/db/migrations"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[env.production.triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

[[env.production.services]]
binding = "MIZUKAGAMI"
service = "mizukagami-worker"

[[env.production.services]]
binding = "MIZUKAGAMI_DEV"
service = "mizukagami-worker-dev"

# ADR: Channel-Based Routing — DEV LINE OA からの webhook は DEV worker (Service binding) へ
# PROD は MIZUKAGAMI binding を継続。同一 account 内の workers.dev fetch は CF の
# self-fetch prevention 等で 404 になるため、必ず Service binding を使う。
[env.production.vars]
MIZUKAGAMI_DEV_LINE_CHANNEL_ID = "2010022438"
